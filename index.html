<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>CC Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#f7f4fc;overflow:hidden}
@media(prefers-color-scheme:dark){html,body{background:#120b1f}}
#f{position:fixed;left:0;right:0;bottom:0;top:var(--pt,0px);width:100%;height:100%;border:0;background:transparent;opacity:0;transition:opacity .25s}
#f.on{opacity:1}
#l{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui,sans-serif;color:#6d28d9}
#l i{width:34px;height:34px;border-radius:50%;border:4px solid #d9ccf5;border-top-color:#6d28d9;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="l"><i></i></div>
<iframe id="f" allow="clipboard-write; clipboard-read; fullscreen"></iframe>
<script>
/* >>> the ONLY line to edit: your Apps Script web-app address (ends with /exec) <<< */
var EXEC="https://script.google.com/macros/s/AKfycbxUPL9NRJh11IOPi1v27E35eOGF2c9RTLaVdE1i5dpQF3cn4OEcSQccmmzSfXgR2oLkJw/exec"; 

/* set to true to hide Telegram's top bar (phones, Telegram 8.0+). Leave false for the normal full-height app. */
var FULLSCREEN=false;

var q=new URLSearchParams(location.search),t=q.get("t")||"",f=document.getElementById("f"),l=document.getElementById("l");
try{var W=window.Telegram&&Telegram.WebApp;if(W){W.ready();W.expand();try{W.disableVerticalSwipes&&W.disableVerticalSwipes()}catch(e){}
  var pad=function(){var a=W.safeAreaInset||{},b=W.contentSafeAreaInset||{};document.documentElement.style.setProperty("--pt",W.isFullscreen?((a.top||0)+(b.top||0))+"px":"0px")};
  ["safeAreaChanged","contentSafeAreaChanged","fullscreenChanged","viewportChanged"].forEach(function(e){try{W.onEvent(e,pad)}catch(x){}});
  if(FULLSCREEN&&W.requestFullscreen){try{W.requestFullscreen()}catch(e){}}
  pad()}}catch(e){}
if(!t){l.innerHTML='<div style="text-align:center;padding:24px">Open this app from the bot: send /start and tap <b>Open App</b>.</div>'}
else{
  f.src=EXEC+"?t="+encodeURIComponent(t);
  f.onload=function(){f.classList.add("on");l.style.display="none"};
  setTimeout(function(){f.classList.add("on");l.style.display="none"},9000); // never stay on the spinner
}
</script>
</body></html>
